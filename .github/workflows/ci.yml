name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskforge_test
          POSTGRES_USER: taskforge
          POSTGRES_PASSWORD: taskforge123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://taskforge:taskforge123@localhost:5432/taskforge_test
      REDIS_URL: redis://localhost:6379/0
      GROQ_API_KEY: test_key
      AVIATIONSTACK_API_KEY: test_key
      TAVILY_API_KEY: test_key
      SECRET_KEY: test_secret_key_for_ci_only
      DEFAULT_ORIGIN_IATA: DAC

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          cd api
          ruff check src/

      - name: Type check with mypy
        run: |
          cd api
          mypy src/ --ignore-missing-imports
        continue-on-error: true

      - name: Run unit tests
        run: |
          cd api/src
          pytest tests/unit/ -v --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: api/src/coverage.xml
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t taskforge-api ./api

      - name: Build Frontend image
        run: docker build -t taskforge-frontend ./frontend
